[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-attention"
description = "Engine-agnostic Ascend fused operators: capabilities, plans, and compiled kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AscendAttention contributors" }]
keywords = ["ascend", "npu", "tilelang", "attention", "inference", "operators"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

# The library itself needs only torch: capability query, planning and the pure-torch baselines are
# host-side.  The NPU runtime and the TileLang toolchain are extras, because the contract is
# "no NPU, no toolchain, still importable and still able to explain what is missing".
# The floor, not the pin: this must stay installable on a machine that is not ours.  The *exact* set every
# committed number was measured with lives in `constraints.txt` (torch 2.13.0+cpu / torch_npu 2.13.0rc1 /
# tilelang 0.1.15 / CANN 9.3), and `pip install -c constraints.txt ...` is the supported way to reproduce
# the reference box.  `tests/test_pyproject.py` keeps the two files honest.
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
npu = ["torch_npu>=2.5"]
tilelang = ["tilelang>=0.1.15"]
dev = ["pytest>=7"]
# Convenience: the exact reference set, for a machine that is allowed to install pinned wheels.
pinned = ["torch==2.13.0", "torch-npu==2.13.0rc1", "tilelang==0.1.15"]
# The platform repo is a consumer, never a dependency: this extra only exists for the cross-repo
# manifest contract test, and it is deliberately not installable from this package.
dev-platform = []

# The provider contract with AscendPlatform (its `contracts/provider.py` owns the group constant and the
# descriptor schema; docs/notes/repo-boundary.md §5 there).  One entry per operator library: the value is a
# factory returning a Provider that can `describe()` and `load()` a semantic op name.  Declared here so an
# installed wheel is discoverable; `tests/test_provider.py` checks the target imports without installing.
[project.entry-points."ascend_platform.providers"]
ascend_attention = "ascend_attention.provider:provider"

[project.urls]
Homepage = "https://github.com/EeroEternal/AscendAttention"

[tool.setuptools.dynamic]
version = { attr = "ascend_attention._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ascend_attention*"]

[tool.setuptools.package-data]
ascend_attention = ["manifest.json"]

[tool.setuptools.data-files]
# Ship the pin next to the wheel's metadata: `pip install -c constraints.txt` needs the file, and a wheel
# that does not carry it makes the numbers unreproducible for anyone who installed rather than cloned.
"share/ascend-attention" = ["constraints.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "npu: test requires an Ascend NPU",
  "tilelang: test requires the TileLang toolchain",
]
